<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Для моей принцесски ❤️</title>
<meta name="description" content="Открытка на день рождения с тёплыми словами.">
<link rel="icon" href="assets/favicon.ico" type="image/x-icon">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;600&family=Pacifico&display=swap" rel="stylesheet">
<style>html,body,#root{margin:0;min-height:100%;} body{margin:0;}
/* ==========================================================================
   Birthday card page ("Открытка")
   Soft pink paper with a painted floral vine wrapping every frame.
   ========================================================================== */

.card-page {
  color: #632d49;
  font-family: Comfortaa, cursive;
  background: linear-gradient(135deg, #ffd9e7, #f8b8d1, #ffddea);
  min-height: 100vh;
  overflow-x: hidden;
}

.card-page:before {
  content: "♡  🦋  ♡  🦋  ♡  🦋  ♡";
  position: fixed;
  inset: 0;
  pointer-events: none;
  color: #ffffff88;
  font-size: 25px;
  line-height: 4;
  letter-spacing: 25px;
  z-index: 0;
}

.card-page .wrap {
  width: min(940px, 88%);
  margin: auto;
  position: relative;
  z-index: 1;
  padding-top: 26px;
}

.card-page .box {
  position: relative;
  background: transparent;
  border: 0;
  border-radius: 30px;
  padding: 46px 46px;
  margin: 50px 0;
  box-shadow:
    0 12px 35px #85315333,
    0 0 40px #ff8fc0aa,
    0 0 70px #f58fb966,
    inset 0 0 40px #ffc2dd80;
}

.card-page .box::before,
.card-page .card::before,
.card-page .mood::before,
.card-page .mcard::before,
.card-page .rubric-btn::before {
  content: "";
  position: absolute;
  inset: 9px;
  border-radius: inherit;
  background: #fffafdc9;
  z-index: 0;
}

.card-page .box > :not(.vine-layer),
.card-page .card > :not(.vine-layer),
.card-page .mood > :not(.vine-layer),
.card-page .mcard > :not(.vine-layer),
.card-page .rubric-btn > :not(.vine-layer) {
  position: relative;
  z-index: 1;
}

.card-page h1,
.card-page .title {
  font-family: Pacifico, cursive;
  font-weight: 400;
  color: #9d416d;
  text-align: center;
}

.card-page h1 {
  font-size: clamp(30px, 7vw, 56px);
  line-height: 1.3;
  text-shadow: 0 2px #fff;
  margin: 0 0 26px;
}

.card-page .lead {
  white-space: pre-line;
  line-height: 1.85;
  font-size: 16px;
}

.card-page .title {
  font-size: clamp(27px, 6vw, 42px);
  margin: 60px 0 34px;
}

.card-page .photos,
.card-page .moods {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
  gap: 46px 40px;
}

.card-page .card {
  position: relative;
  background: transparent;
  border: 0;
  border-radius: 24px;
  padding: 18px;
  box-shadow:
    0 8px 24px #782d4d30,
    0 0 26px #ff8fc0aa,
    0 0 48px #f58fb955;
  animation: photo-card-breathe 9s ease-in-out infinite;
  transform-origin: center;
  transition: box-shadow 0.3s ease;
}

@keyframes photo-card-breathe {
  0%,
  100% {
    transform: scale(1);
  }
  50% {
    transform: scale(1.018);
  }
}

.card-page .card:nth-child(even) {
  animation-delay: -4.5s;
}

.card-page .card:hover {
  box-shadow:
    0 10px 28px #782d4d38,
    0 0 40px #f56ba396,
    0 0 70px #f58fb977;
}

.card-page .photo {
  display: block;
  width: 100%;
  height: auto;
  border-radius: 17px;
}

.card-page .caption {
  line-height: 1.7;
  font-size: 14px;
  padding: 12px 3px 5px;
}

.card-page .intro {
  text-align: center;
  line-height: 1.8;
}

.card-page .moods {
  margin-top: 42px;
}

@keyframes mood-glow {
  0%,
  100% {
    box-shadow:
      0 8px 20px #782d4d2b,
      0 0 30px #ff7fb8aa,
      0 0 55px #f58fb966,
      inset 0 0 30px #ffbad680;
  }
  50% {
    box-shadow:
      0 8px 22px #782d4d33,
      0 0 48px #ff5aa2c4,
      0 0 85px #f56ba388,
      inset 0 0 38px #ffa8ce99;
  }
}

.card-page .mood {
  position: relative;
  border: 0;
  border-radius: 24px;
  background: transparent;
  color: #71334f;
  padding: 30px 30px;
  font: 600 15px Comfortaa, cursive;
  cursor: pointer;
  box-shadow:
    0 8px 20px #782d4d2b,
    0 0 30px #ff7fb8aa,
    0 0 55px #f58fb966,
    inset 0 0 30px #ffbad680;
  animation: mood-glow 3.6s ease-in-out infinite;
  transition: transform 0.2s ease, box-shadow 0.3s ease;
  min-height: 176px;
  overflow: visible;
}

/* чередование: розовая — белая — розовая... */
.card-page .mood:nth-child(odd) {
  animation-delay: -1.8s;
}

.card-page .mood:nth-child(odd)::before {
  background: linear-gradient(135deg, #fbc9dd, #f7a8c8);
}

.card-page .mood:hover {
  transform: translateY(-2px);
  animation-play-state: paused;
  box-shadow:
    0 10px 24px #782d4d38,
    0 0 55px #ff4d9bd6,
    0 0 90px #f56ba388,
    inset 0 0 40px #ff9cc8aa;
}

.card-page .mood:active {
  transform: translateY(1px) scale(0.97);
}

.butterfly-flight {
  position: absolute;
  inset: 0;
  z-index: 4;
  pointer-events: none;
}

.butterfly {
  position: absolute;
  left: -14px;
  top: -11px;
  display: block;
  width: 28px;
  height: 22px;
  filter: drop-shadow(0 2px 2px #49253f73);
  perspective: 80px;
  transform: translate(var(--end-x), var(--end-y)) rotate(var(--turn)) scale(var(--size));
}

.butterfly-body {
  position: absolute;
  inset: 0;
  transform: rotate(-9deg);
  transform-style: preserve-3d;
}

.butterfly-thorax {
  position: absolute;
  left: 11px;
  top: 3px;
  width: 3px;
  height: 16px;
  border-radius: 55% 55% 45% 45%;
  background: linear-gradient(90deg, #301d22, #6c4939 48%, #21171c);
  box-shadow: 0 -2px 0 0 #24171a;
  z-index: 3;
}

.butterfly-wing {
  position: absolute;
  top: 1px;
  width: 14px;
  height: 18px;
  overflow: hidden;
  background:
    radial-gradient(ellipse at 65% 24%, #fff4cb 0 7%, #4b293d 8% 12%, transparent 13%),
    radial-gradient(ellipse at 34% 72%, #fbe3a3 0 8%, #64324e 9% 14%, transparent 15%),
    repeating-radial-gradient(ellipse at 100% 55%, transparent 0 5px, #4c2b3b55 6px 7px),
    linear-gradient(145deg, #f8c45c 4%, #df714d 48%, #7b385d 100%);
  border: 1px solid #4a2938;
  box-shadow: inset 0 0 0 1px #f8d38173;
  z-index: 2;
  backface-visibility: visible;
}

.butterfly-wing--left {
  right: 14px;
  border-radius: 90% 32% 72% 38%;
  transform-origin: right center;
  animation: butterfly-left-wing 0.11s ease-in-out infinite alternate;
}

.butterfly-wing--right {
  left: 14px;
  border-radius: 32% 90% 38% 72%;
  transform-origin: left center;
  animation: butterfly-right-wing 0.11s ease-in-out infinite alternate;
}

.butterfly-spot {
  position: absolute;
  display: block;
  border-radius: 50%;
  background: #64324e;
  opacity: 0.72;
}

.butterfly-spot--upper {
  width: 4px;
  height: 5px;
  top: 3px;
  left: 4px;
}

.butterfly-spot--lower {
  width: 3px;
  height: 3px;
  right: 2px;
  bottom: 3px;
  background: #f9db8c;
}

.butterfly-antenna {
  position: absolute;
  top: -4px;
  left: 12px;
  width: 1px;
  height: 8px;
  border-left: 1px solid #3b242a;
  border-radius: 50%;
  transform-origin: bottom;
  z-index: 4;
}

.butterfly-antenna--left { transform: rotate(-28deg); }
.butterfly-antenna--right { transform: rotate(28deg); }

@keyframes butterfly-left-wing {
  from { transform: rotateY(12deg) rotateZ(-7deg); }
  to { transform: rotateY(72deg) rotateZ(5deg); }
}

@keyframes butterfly-right-wing {
  from { transform: rotateY(-12deg) rotateZ(7deg); }
  to { transform: rotateY(-72deg) rotateZ(-5deg); }
}

.butterfly:nth-child(3n + 2) .butterfly-wing {
  background:
    radial-gradient(circle at 66% 27%, #fff6d6 0 8%, transparent 9%),
    radial-gradient(circle at 36% 70%, #fff0bf 0 7%, transparent 8%),
    linear-gradient(145deg, #f5d768 8%, #d68755 55%, #775472 100%);
}

.butterfly:nth-child(3n) .butterfly-wing {
  background:
    radial-gradient(circle at 66% 27%, #fff1d0 0 8%, transparent 9%),
    radial-gradient(circle at 36% 70%, #f9dfc0 0 7%, transparent 8%),
    linear-gradient(145deg, #eaa984 8%, #b55773 54%, #633852 100%);
}

.butterfly-flight--arriving .butterfly {
  animation: butterfly-arrive 1.25s cubic-bezier(0.3, 0.05, 0.2, 1) var(--delay) both;
}

.butterfly-flight--resting .butterfly {
  transform: translate(var(--end-x), var(--end-y)) rotate(var(--turn)) scale(var(--size));
}

.butterfly-flight--leaving .butterfly {
  animation: butterfly-leave 1.25s cubic-bezier(0.55, 0, 0.75, 0.35) calc(var(--delay) / 3) both;
}

@keyframes butterfly-arrive {
  0% {
    opacity: 0;
    transform: translate(var(--start-x), var(--start-y)) rotate(0) scale(0.15);
  }
  8% { opacity: 1; }
  100% { opacity: 1; transform: translate(var(--end-x), var(--end-y)) rotate(var(--turn)) scale(var(--size)); }
}

@keyframes butterfly-leave {
  0% { opacity: 1; transform: translate(var(--end-x), var(--end-y)) rotate(var(--turn)) scale(var(--size)); }
  88% { opacity: 1; }
  100% { opacity: 0; transform: translate(var(--start-x), var(--start-y)) rotate(8deg) scale(0.12); }
}

.card-page .mood-label {
  position: relative;
  z-index: 1;
}

.card-page .mphoto {
  display: block;
  width: min(420px, 88%);
  height: auto;
  margin: 0 auto 22px;
  border-radius: 22px;
  border: 5px solid #fff;
  box-shadow: 0 10px 26px #782d4d33;
}

.card-page .modal {
  position: fixed;
  inset: 0;
  background: #41192d99;
  backdrop-filter: blur(5px);
  align-items: center;
  justify-content: center;
  padding: 34px 26px;
  z-index: 5;
  display: none;
  overflow-y: auto;
}

.card-page .modal.open {
  display: flex;
  animation: modal-backdrop-in 0.24s ease-out both;
}

.card-page .modal--closing {
  animation: modal-backdrop-out 0.9s ease-in both;
}

.card-page .modal--closing .mcard {
  animation: mood-window-close 0.9s ease-in both;
}

@keyframes modal-backdrop-out {
  0%, 64% { opacity: 1; }
  100% { opacity: 0; }
}

@keyframes mood-window-close {
  0%, 58% { opacity: 1; transform: translateY(0) scale(1); }
  100% { opacity: 0; transform: translateY(12px) scale(0.96); }
}

@keyframes modal-backdrop-in {
  from { opacity: 0; }
  to { opacity: 1; }
}

@keyframes modal-glow {
  0%,
  100% {
    box-shadow:
      0 25px 70px #280c1c66,
      0 0 48px #ff7fb8b3,
      0 0 85px #f58fb966;
  }
  50% {
    box-shadow:
      0 25px 70px #280c1c66,
      0 0 70px #ff5aa2c4,
      0 0 110px #f58fb977;
  }
}

.card-page .mcard {
  position: relative;
  width: min(650px, 100%);
  margin: auto;
  overflow: visible;
  background: transparent;
  border: 0;
  border-radius: 30px;
  padding: 42px 40px;
  box-shadow:
    0 25px 70px #280c1c66,
    0 0 48px #ff7fb8b3,
    0 0 85px #f58fb966;
  animation:
    mood-window-open 0.32s cubic-bezier(0.2, 0.84, 0.32, 1) both,
    modal-glow 3.6s ease-in-out 0.32s infinite;
}

@keyframes mood-window-open {
  from {
    opacity: 0;
    transform: translateY(14px) scale(0.92);
  }
  to {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
}

@media (prefers-reduced-motion: reduce) {
  .butterfly-flight {
    display: none;
  }

  .card-page .mood--bursting,
  .card-page .modal.open,
  .card-page .mcard {
    animation: none;
  }
}

.card-page .mcard::before {
  background: #fff8fc;
}

.card-page .close {
  position: absolute;
  right: 12px;
  top: 10px;
  width: 40px;
  height: 40px;
  border: 0;
  border-radius: 50%;
  background: #f5c1d7;
  color: #73334f;
  font-size: 25px;
  cursor: pointer;
  z-index: 2;
}

.card-page .mtitle {
  font: 400 29px Pacifico, cursive;
  text-align: center;
  color: #9d416d;
  margin: 8px 40px 20px;
}

.card-page .mtext {
  white-space: pre-line;
  line-height: 1.8;
  font-size: 16px;
}

.card-page footer {
  height: 70px;
}

/* --- floral vine overlay --- */
.vine-layer {
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 3;
  filter: drop-shadow(0 2px 2px #6f2c4a22);
}

.vine-rose {
  position: absolute;
}

.vine-rose--tl {
  left: -26px;
  top: -26px;
}

.vine-rose--tr {
  right: -26px;
  top: -26px;
}

.vine-rose--br {
  right: -26px;
  bottom: -26px;
}

.vine-rose--bl {
  left: -26px;
  bottom: -26px;
}

.card-page .card .vine-rose,
.card-page .mood .vine-rose {
  --o: -18px;
  left: auto;
  right: auto;
  top: auto;
  bottom: auto;
}

.card-page .card .vine-rose--tl,
.card-page .mood .vine-rose--tl {
  left: var(--o);
  top: var(--o);
}

.card-page .card .vine-rose--tr,
.card-page .mood .vine-rose--tr {
  right: var(--o);
  top: var(--o);
}

.card-page .card .vine-rose--br,
.card-page .mood .vine-rose--br {
  right: var(--o);
  bottom: var(--o);
}

.card-page .card .vine-rose--bl,
.card-page .mood .vine-rose--bl {
  left: var(--o);
  bottom: var(--o);
}

@media (max-width: 600px) {
  .card-page .box {
    padding: 34px 22px;
  }
  .card-page .lead {
    font-size: 15px;
  }
  .card-page .photos,
  .card-page .moods {
    grid-template-columns: 1fr;
  }
}

@media (prefers-reduced-motion: reduce) {
  .card-page .card {
    animation: none;
  }
}

/* ==========================================================================
   Rubric navigation: two big buttons on the home screen + rubric pages
   ========================================================================== */

.card-page .rubric-nav {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
  gap: 32px;
  margin: 54px 0 6px;
}

.card-page .rubric-btn {
  position: relative;
  border: 0;
  border-radius: 24px;
  background: transparent;
  color: #71334f;
  padding: 40px 28px;
  font: 400 22px Pacifico, cursive;
  cursor: pointer;
  min-height: 140px;
  overflow: visible;
  box-shadow:
    0 8px 20px #782d4d2b,
    0 0 30px #ff7fb8aa,
    0 0 55px #f58fb966,
    inset 0 0 30px #ffbad680;
  animation: mood-glow 3.6s ease-in-out infinite;
  transition: transform 0.2s ease, box-shadow 0.3s ease;
}

.card-page .rubric-btn:nth-child(even) {
  animation-delay: -1.8s;
}

.card-page .rubric-btn:nth-child(even)::before {
  background: linear-gradient(135deg, #fbc9dd, #f7a8c8);
}

.card-page .rubric-btn:hover {
  transform: translateY(-3px);
  animation-play-state: paused;
  box-shadow:
    0 12px 26px #782d4d38,
    0 0 55px #ff4d9bd6,
    0 0 90px #f56ba388,
    inset 0 0 40px #ff9cc8aa;
}

.card-page .rubric-btn:active {
  transform: translateY(1px) scale(0.97);
}

.card-page .rubric-btn-label {
  position: relative;
  z-index: 1;
  display: block;
  line-height: 1.4;
}

/* --- "Маленький секрет сайта": full-screen fade message --- */

.card-page .secret-overlay {
  position: fixed;
  inset: 0;
  z-index: 60;
  display: flex;
  align-items: center;
  justify-content: center;
  background: radial-gradient(circle at 50% 45%, #41192de6, #2a0f1f);
  backdrop-filter: blur(3px);
  animation: secret-overlay-in 0.6s ease-out both;
}

.card-page .secret-overlay--out {
  animation: secret-overlay-out 0.9s ease-in both;
}

.card-page .secret-text {
  font-family: Pacifico, cursive;
  font-weight: 400;
  font-size: clamp(30px, 9vw, 64px);
  line-height: 1.3;
  color: #ffe3ef;
  text-align: center;
  padding: 0 24px;
  text-shadow: 0 0 18px #ff7fb8cc, 0 0 40px #f58fb988;
  animation: secret-text-in 0.6s ease-out both;
}

.card-page .secret-overlay--out .secret-text {
  animation: secret-text-out 0.9s ease-in both;
}

@keyframes secret-overlay-in {
  from { opacity: 0; }
  to { opacity: 1; }
}

@keyframes secret-overlay-out {
  from { opacity: 1; }
  to { opacity: 0; }
}

@keyframes secret-text-in {
  from { opacity: 0; transform: scale(0.9); }
  to { opacity: 1; transform: scale(1); }
}

@keyframes secret-text-out {
  from { opacity: 1; transform: scale(1); }
  to { opacity: 0; transform: scale(1.05); }
}

/* --- rubric page wrapper with close cross at the very top --- */

.card-page .rubric {
  animation: rubric-in 0.42s ease both;
}

@keyframes rubric-in {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: none; }
}

.card-page .rubric-topbar {
  position: sticky;
  top: 12px;
  z-index: 6;
  display: flex;
  justify-content: flex-start;
  margin-bottom: 8px;
}

.card-page .rubric-close {
  width: 48px;
  height: 48px;
  border: 0;
  border-radius: 50%;
  background: #f5c1d7;
  color: #73334f;
  font-size: 22px;
  line-height: 1;
  cursor: pointer;
  box-shadow:
    0 6px 18px #782d4d40,
    0 0 24px #ff8fc0aa,
    inset 0 0 14px #ffbad680;
  transition: transform 0.25s ease, box-shadow 0.3s ease, background 0.3s ease;
  display: grid;
  place-items: center;
}

.card-page .rubric-close:hover {
  transform: rotate(90deg) scale(1.06);
  background: #f7a8c8;
  box-shadow:
    0 8px 22px #782d4d4d,
    0 0 38px #ff4d9bd6,
    inset 0 0 18px #ffa8ce99;
}

.card-page .rubric-close:active {
  transform: scale(0.92);
}

.card-page .rubric-close-cross {
  display: block;
  width: 16px;
  height: 16px;
  position: relative;
}

.card-page .rubric-close-cross::before,
.card-page .rubric-close-cross::after {
  content: "";
  position: absolute;
  left: 7px;
  top: 0;
  width: 2px;
  height: 16px;
  background: currentColor;
  border-radius: 2px;
}

.card-page .rubric-close-cross::before {
  transform: rotate(45deg);
}

.card-page .rubric-close-cross::after {
  transform: rotate(-45deg);
}

@media (prefers-reduced-motion: reduce) {
  .card-page .rubric,
  .card-page .rubric-btn,
  .card-page .rubric-close {
    animation: none;
    transition: none;
  }
}

@media (max-width: 600px) {
  .card-page .rubric-nav {
    grid-template-columns: 1fr;
  }
  .card-page .rubric-btn {
    font-size: 19px;
    padding: 32px 22px;
    min-height: 116px;
  }
}
/* A tiny bird that lives on the page itself — scrolling never moves it. */
.card-page .floating-pink-bird {
  position: absolute;
  left: 0;
  top: 0;
  width: 72px;
  height: 72px;
  z-index: 40;
  padding: 17px;
  border: 0;
  border-radius: 50%;
  background: transparent;
  color: inherit;
  cursor: pointer;
  touch-action: manipulation;
  filter: drop-shadow(0 4px 5px rgba(151, 55, 99, .22));
  transform: translate3d(var(--bird-x), var(--bird-y), 0);
  transition: transform var(--bird-duration) cubic-bezier(.45, .08, .35, 1);
  will-change: transform;
}
.card-page .floating-pink-bird:hover,
.card-page .floating-pink-bird:focus-visible {
  outline: none;
  filter: drop-shadow(0 4px 7px rgba(151, 55, 99, .38)) drop-shadow(0 0 12px #ff5aa2);
}
.card-page .floating-pink-bird:focus-visible {
  box-shadow: 0 0 0 3px #fff8fc, 0 0 0 6px #b84279;
}
.card-page .floating-pink-bird:active .floating-pink-bird-bob {
  transform: scale(.86);
}
